# Done in accordance with https://fabricmc.net/2026/03/14/261.html
# NOTE: if your machine is behind a TLS-inspecting proxy and Gradle can't download
# dependencies (PKIX path building failed), build with:
#   GRADLE_OPTS=-Djavax.net.ssl.trustStoreType=Windows-ROOT
# (kept out of here so CI / normal machines build portably).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric  (26.1 is the first UNOBFUSCATED Minecraft -> official Mojang mappings, no Yarn)
minecraft_version=26.1.2
loader_version=0.18.4

# Fabric API. Pick the build tagged for 26.1 from https://modrinth.com/mod/fabric-api/versions
# (version string looks like "0.xxx.x+26.1"). Update this to the exact published value.
fabric_version=0.151.0+26.1.2

# Mod
mod_version=1.5.0
maven_group=com.automine
archives_base_name=automine
